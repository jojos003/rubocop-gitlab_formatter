require:
  - ./lib/rubocop/formatter/gitlab_formatter

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable

Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/BlockLength:
  AllowedMethods:
    - describe

Naming/FileName:
  Exclude:
    - lib/rubocop-gitlab_formatter.rb

RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/SpecFilePathFormat:
  Exclude:
    - spec/rubocop/formatter/gitlab_formatter_spec.rb
